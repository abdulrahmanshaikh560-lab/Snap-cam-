<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snap Camera - 100% Working</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;overflow:hidden;height:100vh}.top{position:fixed;top:0;left:0;right:0;z-index:10;padding:10px 15px;display:flex;justify-content:space-between;background:linear-gradient(#000,transparent)}#box{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}#v{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#stickers{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:80px;transform:scaleX(-1)}#stickers span{position:absolute}.filters{position:fixed;bottom:110px;left:0;right:0;display:flex;gap:10px;overflow-x:auto;padding:0 15px;z-index:10}.filters::-webkit-scrollbar{display:none}.f{flex-shrink:0;width:60px;height:60px;border-radius:50%;border:3px solid #555;background:rgba(0,0,0,0.6);color:#fff;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}.f.active{border-color:#FFFC00;background:#FFFC00;color:#000;transform:scale(1.15)}.f small{font-size:8px;font-weight:700;margin-top:2px}.controls{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:20px;display:flex;justify-content:space-around;align-items:center;background:linear-gradient(transparent,#000)}#cap{width:75px;height:75px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,0.4)}.s{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:18px}#preview{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#preview img{flex:1;object-fit:contain;background:#111}</style></head><body>
<div class="top"><div><b>👻 SNAP CAM</b><div style="font-size:9px;opacity:0.7">100% Working • Snapchat Style</div></div><div style="background:#FFFC00;color:#000;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:700">FACE FILTER ON</div></div>

<div id="box">
<video id="v" autoplay playsinline></video>
<div id="stickers"><span id="s1"></span></div>
</div>

<div class="filters">
<button class="f active" onclick="setF('none',this)">😊<small>ORIGINAL</small></button>
<button class="f" onclick="setF('dog',this)">🐶<small>DOG</small></button>
<button class="f" onclick="setF('cool',this)">😎<small>COOL</small></button>
<button class="f" onclick="setF('crown',this)">👑<small>CROWN</small></button>
<button class="f" onclick="setF('heart',this)">😍<small>HEART</small></button>
<button class="f" onclick="setF('beauty',this)">✨<small>BEAUTY</small></button>
<button class="f" onclick="setF('devil',this)">😈<small>DEVIL</small></button>
<button class="f" onclick="setF('bw',this)">⚫<small>B&W</small></button>
</div>

<div class="controls"><button class="s" onclick="flip()">🔄</button><button id="cap" onclick="shot()"></button><button class="s" onclick="alert('Filter dabao, face beech me rakho!')">👻</button></div>

<div id="preview"><div style="padding:12px;display:flex;justify-content:space-between;background:#111"><b>Preview</b><button onclick="document.getElementById('preview').style.display='none'" style="background:#333;color:#fff;padding:6px 12px;border-radius:20px;border:none">✕</button></div><img id="pImg"><div style="padding:12px;display:flex;gap:10px"><button onclick="saveP()" style="flex:1;background:#FFFC00;color:#000;padding:12px;border-radius:10px;border:none;font-weight:700">💾 SAVE</button><button onclick="document.getElementById('preview').style.display='none'" style="flex:1;background:#333;color:#fff;padding:12px;border-radius:10px;border:none">RETAKE</button></div></div>

<canvas id="c" style="display:none"></canvas>
<script>
let v=document.getElementById('v'),s1=document.getElementById('s1'),cur='none',facing='user',stream=null;
async function start(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});v.srcObject=stream;}catch(e){alert('Allow dabao: '+e.message);}}start();
function flip(){facing=facing=='user'?'environment':'user';start();}
function setF(f,btn){
cur=f;document.querySelectorAll('.f').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
v.style.filter='none'; s1.innerHTML=''; s1.style.fontSize='80px';
if(f==='none'){}
else if(f==='dog'){s1.innerHTML='🐶'; s1.style.fontSize='120px'; s1.style.top='15%'; v.style.filter='contrast(115%) saturate(120%)';}
else if(f==='cool'){s1.innerHTML='😎'; s1.style.fontSize='140px'; s1.style.top='35%';}
else if(f==='crown'){s1.innerHTML='👑'; s1.style.fontSize='90px'; s1.style.top='12%';}
else if(f==='heart'){s1.innerHTML='😍'; s1.style.fontSize='130px'; s1.style.top='35%'; v.style.filter='saturate(130%) brightness(110%)';}
else if(f==='beauty'){s1.innerHTML='✨'; s1.style.fontSize='60px'; s1.style.top='10%'; v.style.filter='brightness(120%) contrast(105%) blur(0.3px)';}
else if(f==='devil'){s1.innerHTML='😈'; s1.style.fontSize='120px'; s1.style.top='20%';}
else if(f==='bw'){v.style.filter='grayscale(100%) contrast(130%)';}
}
function shot(){
let c=document.getElementById('c'),ctx=c.getContext('2d');c.width=v.videoWidth;c.height=v.videoHeight;
ctx.translate(c.width,0);ctx.scale(-1,1);
ctx.filter=v.style.filter;ctx.drawImage(v,0,0,c.width,c.height);
ctx.filter='none';ctx.font=`${c.width*0.2}px Arial`;ctx.textAlign='center';
if(cur==='dog')ctx.fillText('🐶',c.width/2,c.height*0.25);
else if(cur==='cool')ctx.fillText('😎',c.width/2,c.height*0.5);
else if(cur==='crown')ctx.fillText('👑',c.width/2,c.height*0.22);
else if(cur==='heart')ctx.fillText('😍',c.width/2,c.height*0.5);
else if(cur==='beauty')ctx.fillText('✨',c.width/2,c.height*0.18);
else if(cur==='devil')ctx.fillText('😈',c.width/2,c.height*0.3);
document.getElementById('pImg').src=c.toDataURL('image/jpeg',0.92);
document.getElementById('preview').style.display='flex';
}
function saveP(){let a=document.createElement('a');a.href=document.getElementById('pImg').src;a.download='SNAP_'+Date.now()+'.jpg';a.click();document.getElementById('preview').style.display='none';}
</script></body></html>
