<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snap Cam - Real Filters</title>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#FFFC00"><link rel="icon" href="./icon.jpg">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;overflow:hidden;height:100vh}.top{position:fixed;top:0;left:0;right:0;z-index:10;padding:12px 15px;display:flex;justify-content:space-between;background:linear-gradient(#000,transparent)}#box{width:100vw;height:100vh}#v{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);transition:filter 0.3s}.filters{position:fixed;bottom:110px;left:0;right:0;display:flex;gap:10px;overflow-x:auto;padding:0 15px;z-index:10}.filters::-webkit-scrollbar{display:none}.f{flex-shrink:0;min-width:62px;height:62px;border-radius:14px;border:2px solid #444;background:rgba(20,20,20,0.8);color:#fff;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px)}.f.active{border-color:#FFFC00;background:#FFFC00;color:#000;transform:scale(1.1)}.f i{font-size:18px;margin-bottom:3px;font-style:normal}.controls{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:18px;display:flex;justify-content:space-around;align-items:center;background:linear-gradient(transparent,#000)}#cap{width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,0.5)}#cap:active{transform:scale(0.92)}.s{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:18px}#preview{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#preview img{flex:1;object-fit:contain;background:#111}</style></head><body>
<div class="top"><div><b>SNAP CAM</b><div style="font-size:9px;opacity:0.7" id="fname">ORIGINAL • Real Filter</div></div><div style="background:#FFFC00;color:#000;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:700">HD</div></div>
<div id="box"><video id="v" autoplay playsinline></video></div>
<div class="filters">
<button class="f active" onclick="setF('none','ORIGINAL',this)"><i>⚪</i>ORIGINAL</button>
<button class="f" onclick="setF('beauty','BEAUTY',this)"><i>✨</i>BEAUTY</button>
<button class="f" onclick="setF('smooth','SMOOTH',this)"><i>💎</i>SMOOTH</button>
<button class="f" onclick="setF('warm','WARM',this)"><i>🔆</i>WARM</button>
<button class="f" onclick="setF('cold','COLD',this)"><i>❄️</i>COLD</button>
<button class="f" onclick="setF('bw','B & W',this)"><i>⚫</i>B&W</button>
<button class="f" onclick="setF('vintage','VINTAGE',this)"><i>📼</i>VINTAGE</button>
<button class="f" onclick="setF('cinema','CINEMA',this)"><i>🎬</i>CINEMA</button>
<button class="f" onclick="setF('golden','GOLDEN',this)"><i>🌟</i>GOLDEN</button>
</div>
<div class="controls"><button class="s" onclick="flip()">🔄</button><button id="cap" onclick="shot()"></button><button class="s" onclick="setF('none','ORIGINAL',document.querySelector('.f'))">♻️</button></div>
<div id="preview"><div style="padding:12px;display:flex;justify-content:space-between;background:#111"><b id="pname">Preview</b><button onclick="document.getElementById('preview').style.display='none'" style="background:#333;color:#fff;padding:6px 14px;border-radius:20px;border:none">✕</button></div><img id="pImg"><div style="padding:12px;display:flex;gap:10px"><button onclick="saveP()" style="flex:1;background:#FFFC00;color:#000;padding:13px;border-radius:12px;border:none;font-weight:800">💾 SAVE PHOTO</button><button onclick="document.getElementById('preview').style.display='none'" style="flex:1;background:#222;color:#fff;padding:13px;border-radius:12px;border:none">RETAKE</button></div></div>
<canvas id="c" style="display:none"></canvas>
<script>
let v=document.getElementById('v'),cur='none',curName='ORIGINAL',facing='user',stream=null;
const filters={
none:'none',
beauty:'brightness(1.18) contrast(1.05) saturate(1.15) blur(0.4px)',
smooth:'brightness(1.12) contrast(1.08) saturate(1.2) blur(0.6px)',
warm:'brightness(1.08) contrast(1.1) saturate(1.35) sepia(0.15) hue-rotate(-10deg)',
cold:'brightness(1.05) contrast(1.15) saturate(0.9) hue-rotate(15deg)',
bw:'grayscale(1) contrast(1.25) brightness(1.05)',
vintage:'sepia(0.4) contrast(1.15) brightness(0.95) saturate(1.2) hue-rotate(-5deg)',
cinema:'contrast(1.3) brightness(0.95) saturate(1.1) sepia(0.1)',
golden:'brightness(1.15) contrast(1.1) saturate(1.4) sepia(0.25) hue-rotate(-15deg)'
};
async function start(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920}}});v.srcObject=stream;}catch(e){alert('Camera Allow karo');}}start();
function flip(){facing=facing=='user'?'environment':'user';start();}
function setF(key,name,btn){
cur=key;curName=name;
document.querySelectorAll('.f').forEach(b=>b.classList.remove('active'));
btn.classList.add('active'); ka 
  
v.style.filter=filters[key];
document.getElementById('fname').innerText=name+' • Real Filter';
}
function shot(){
let c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=v.videoWidth;c.height=v.videoHeight;
ctx.translate(c.width,0);ctx.scale(-1,1);
ctx.filter=filters[cur];
ctx.drawImage(v,0,0,c.width,c.height);
document.getElementById('pImg').src=c.toDataURL('image/jpeg',0.95);
document.getElementById('pname').innerText=curName;
document.getElementById('preview').style.display='flex';
}
function saveP(){let a=document.createElement('a');a.href=document.getElementById('pImg').src;a.download=curName+'_'+Date.now()+'.jpg';a.click();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
